<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Color Sound 🌈🔊</title>


    <style>

        /* =========================
           ESTILOS GENERALES
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #ff1493,
                    #ff6b00,
                    #ffd500,
                    #b6ff3b,
                    #00e5c8,
                    #00c2ff
                );

            background-size: 400% 400%;

            animation:
                fondoAnimado
                12s
                ease
                infinite;

            padding: 30px;

        }


        /* =========================
           ANIMACIÓN DEL FONDO
        ========================= */

        @keyframes fondoAnimado {

            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }

        }


        /* =========================
           CONTENEDOR
        ========================= */

        .contenedor {

            max-width: 950px;

            margin: auto;

            padding: 40px;

            border-radius: 35px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.88
                );

            box-shadow:
                0 20px 60px
                rgba(
                    0,
                    0,
                    0,
                    0.2
                );

            backdrop-filter:
                blur(15px);

        }


        /* =========================
           TÍTULO
        ========================= */

        h1 {

            text-align: center;

            font-size: 3rem;

            color: #ff1493;

            margin-bottom: 15px;

        }


        .subtitulo {

            text-align: center;

            font-size: 1.2rem;

            color: #555;

            margin-bottom: 35px;

        }


        /* =========================
           ZONA DE IMAGEN
        ========================= */

        .zona-imagen {

            border:

                4px dashed #ff1493;

            border-radius: 25px;

            padding: 30px;

            text-align: center;

            background:

                linear-gradient(
                    135deg,
                    #ffe1f0,
                    #fff5d6,
                    #d8fff0
                );

            transition: 0.4s;

        }


        .zona-imagen:hover {

            transform:
                scale(1.02);

        }


        /* =========================
           INPUT ARCHIVO
        ========================= */

        input[type="file"] {

            display: none;

        }


        .boton-subir {

            display:
                inline-block;

            padding:
                15px
                30px;

            border-radius:
                50px;

            cursor:
                pointer;

            font-weight:
                bold;

            font-size:
                17px;

            color:
                white;

            background:
                linear-gradient(
                    90deg,
                    #ff1493,
                    #ff6b00,
                    #ffd500
                );

            transition:
                0.3s;

        }


        .boton-subir:hover {

            transform:
                translateY(-3px)
                scale(1.05);

            box-shadow:

                0
                10px
                25px

                rgba(
                    255,
                    20,
                    147,
                    0.4
                );

        }


        /* =========================
           IMAGEN
        ========================= */

        #imagen {

            max-width: 100%;

            max-height: 400px;

            display: none;

            margin:
                30px
                auto
                10px
                auto;

            border-radius:
                20px;

            box-shadow:

                0
                15px
                35px

                rgba(
                    0,
                    0,
                    0,
                    0.2
                );

        }


        /* =========================
           INFORMACIÓN
        ========================= */

        .info {

            display: none;

            margin-top: 30px;

            padding: 25px;

            border-radius: 20px;

            background:

                #ffffff;

            box-shadow:

                0
                10px
                25px

                rgba(
                    0,
                    0,
                    0,
                    0.08
                );

        }


        .info h2 {

            color:
                #00a88f;

            margin-bottom:
                15px;

        }


        .dato {

            margin:
                10px
                0;

            font-size:
                18px;

        }


        /* =========================
           COLOR DOMINANTE
        ========================= */

        #colorMuestra {

            width:
                100%;

            height:
                70px;

            border-radius:
                15px;

            margin-top:
                15px;

            border:
                3px
                solid
                white;

        }


        /* =========================
           BOTÓN DE SONIDO
        ========================= */

        .boton-sonido {

            width:
                100%;

            margin-top:
                30px;

            padding:
                20px;

            border:
                none;

            border-radius:
                50px;

            cursor:
                pointer;

            font-size:
                20px;

            font-weight:
                bold;

            color:
                #222;

            background:

                linear-gradient(
                    90deg,
                    #b6ff3b,
                    #00e5c8,
                    #00c2ff
                );

            transition:
                0.3s;

        }


        .boton-sonido:hover {

            transform:
                scale(1.03);

            box-shadow:

                0
                15px
                30px

                rgba(
                    0,
                    200,
                    180,
                    0.35
                );

        }


        /* =========================
           VISUALIZADOR
        ========================= */

        .visualizador {

            display:
                flex;

            justify-content:
                center;

            align-items:
                flex-end;

            gap:
                8px;

            height:
                100px;

            margin-top:
                30px;

        }


        .barra {

            width:
                12px;

            height:
                20px;

            border-radius:
                10px;

            background:
                #ff1493;

        }


        .animar {

            animation:
                sonido
                0.7s
                infinite
                alternate;

        }


        @keyframes sonido {

            0% {

                height:
                    20px;

            }


            100% {

                height:
                    90px;

            }

        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media
        (
            max-width:
            600px
        ) {

            .contenedor {

                padding:
                    20px;

            }


            h1 {

                font-size:
                    2rem;

            }

        }

    </style>

</head>



<body>


    <div class="contenedor">


        <h1>
            🌈 COLOR → SONIDO 🔊
        </h1>


        <p class="subtitulo">

            Sube una imagen y escucha su interpretación sonora.
            Las imágenes oscuras producen sonidos graves y las
            imágenes claras sonidos agudos.

        </p>



        <!-- =========================
             SUBIR IMAGEN
        ========================== -->

        <div class="zona-imagen">


            <label
                for="subirImagen"
                class="boton-subir"
            >

                🖼️ Elegir una imagen

            </label>


            <input
                type="file"
                id="subirImagen"
                accept="image/*"
            >


            <img
                id="imagen"
            >


        </div>



        <!-- =========================
             INFORMACIÓN
        ========================== -->

        <div
            class="info"
            id="info"
        >


            <h2>
                🎨 Análisis de la imagen
            </h2>


            <p class="dato">

                <strong>
                    Brillo promedio:
                </strong>

                <span
                    id="brillo"
                >
                </span>

            </p>



            <p class="dato">

                <strong>
                    Frecuencia:
                </strong>

                <span
                    id="frecuencia"
                >
                </span>

                Hz

            </p>



            <p class="dato">

                <strong>
                    Tipo de sonido:
                </strong>

                <span
                    id="tipoSonido"
                >
                </span>

            </p>



            <p class="dato">

                <strong>
                    Color promedio:
                </strong>

            </p>


            <div
                id="colorMuestra"
            >
            </div>


        </div>



        <!-- =========================
             BOTÓN SONIDO
        ========================== -->

        <button
            class="boton-sonido"
            id="botonSonido"
        >

            ▶️ Escuchar el sonido de la imagen

        </button>



        <!-- =========================
             VISUALIZADOR
        ========================== -->

        <div
            class="visualizador"
            id="visualizador"
        >

            <div class="barra"></div>
            <div class="barra"></div>
            <div class="barra"></div>
            <div class="barra"></div>
            <div class="barra"></div>
            <div class="barra"></div>
            <div class="barra"></div>
            <div class="barra"></div>

        </div>


    </div>



    <!-- =========================
         JAVASCRIPT
    ========================== -->


    <script>


        /* =========================
           VARIABLES
        ========================== */


        const subirImagen =
            document.getElementById(
                "subirImagen"
            );


        const imagen =
            document.getElementById(
                "imagen"
            );


        const info =
            document.getElementById(
                "info"
            );


        const brilloTexto =
            document.getElementById(
                "brillo"
            );


        const frecuenciaTexto =
            document.getElementById(
                "frecuencia"
            );


        const tipoSonido =
            document.getElementById(
                "tipoSonido"
            );


        const colorMuestra =
            document.getElementById(
                "colorMuestra"
            );


        const botonSonido =
            document.getElementById(
                "botonSonido"
            );


        const barras =
            document.querySelectorAll(
                ".barra"
            );



        let frecuenciaActual =
            440;


        let brilloActual =
            128;



        /* =========================
           SUBIR IMAGEN
        ========================== */


        subirImagen.addEventListener(
            "change",
            function (event) {


                const archivo =
                    event.target.files[0];


                if (!archivo) {

                    return;

                }



                const lector =
                    new FileReader();



                lector.onload =
                    function (e) {


                        imagen.src =
                            e.target.result;


                        imagen.style.display =
                            "block";


                        imagen.onload =
                            analizarImagen;

                    };


                lector.readAsDataURL(
                    archivo
                );


            }
        );



        /* =========================
           ANALIZAR IMAGEN
        ========================== */


        function analizarImagen() {


            const canvas =
                document.createElement(
                    "canvas"
                );


            const contexto =
                canvas.getContext(
                    "2d"
                );



            canvas.width =
                imagen.naturalWidth;


            canvas.height =
                imagen.naturalHeight;



            contexto.drawImage(
                imagen,
                0,
                0
            );



            const datos =
                contexto.getImageData(
                    0,
                    0,
                    canvas.width,
                    canvas.height
                ).data;



            let rojo =
                0;


            let verde =
                0;


            let azul =
                0;


            let cantidad =
                0;



            /*
             Analizamos la imagen cada
             20 píxeles para que sea
             más rápido.
            */


            for (
                let i = 0;
                i < datos.length;
                i += 80
            ) {


                rojo +=
                    datos[i];


                verde +=
                    datos[i + 1];


                azul +=
                    datos[i + 2];


                cantidad++;

            }



            /* =========================
               COLOR PROMEDIO
            ========================== */


            rojo =
                Math.floor(
                    rojo / cantidad
                );


            verde =
                Math.floor(
                    verde / cantidad
                );


            azul =
                Math.floor(
                    azul / cantidad
                );



            /* =========================
               BRILLO
            ========================== */


            brilloActual =
                Math.floor(

                    (
                        rojo +
                        verde +
                        azul
                    ) / 3

                );



            /*
             Convertimos el brillo
             de 0 - 255

             a frecuencia
             de 100 - 1000 Hz
            */


            frecuenciaActual =

                Math.floor(

                    100 +

                    (
                        brilloActual / 255
                    )

                    *

                    900

                );



            /* =========================
               MOSTRAR INFORMACIÓN
            ========================== */


            brilloTexto.textContent =
                brilloActual +
                " / 255";


            frecuenciaTexto.textContent =
                frecuenciaActual;


            info.style.display =
                "block";



            /* =========================
               COLOR VISUAL
            ========================== */


            colorMuestra.style.background =

                `rgb(
                    ${rojo},
                    ${verde},
                    ${azul}
                )`;



            /* =========================
               DESCRIPCIÓN DEL SONIDO
            ========================== */


            if (
                brilloActual < 85
            ) {


                tipoSonido.textContent =
                    "🔻 Grave";


            }

            else if (
                brilloActual < 170
            ) {


                tipoSonido.textContent =
                    "🎵 Medio";


            }

            else {


                tipoSonido.textContent =
                    "🔺 Agudo";


            }



            /* =========================
               CAMBIAR BARRAS
            ========================== */


            barras.forEach(
                function (
                    barra,
                    indice
                ) {


                    const altura =

                        20 +

                        (
                            (
                                brilloActual /
                                255
                            )

                            *

                            70
                        )

                        +

                        (
                            indice *
                            2
                        );


                    barra.style.height =
                        altura +
                        "px";

                }
            );


        }



        /* =========================
           CREAR SONIDO
        ========================== */


        botonSonido.addEventListener(
            "click",
            function () {


                /*
                 Web Audio API
                */


                const AudioContext =
                    window.AudioContext ||
                    window.webkitAudioContext;


                const audioContext =
                    new AudioContext();



                const oscilador =
                    audioContext
                    .createOscillator();



                const volumen =
                    audioContext
                    .createGain();



                /*
                 Tipo de onda
                */


                oscilador.type =
                    "sine";


                /*
                 Frecuencia
                 calculada
                 desde la imagen
                */


                oscilador.frequency.value =
                    frecuenciaActual;



                /*
                 Volumen
                */


                volumen.gain.setValueAtTime(
                    0.15,
                    audioContext.currentTime
                );



                /*
                 Conexiones
                */


                oscilador.connect(
                    volumen
                );


                volumen.connect(
                    audioContext.destination
                );



                /*
                 Iniciar sonido
                */


                oscilador.start();



                /*
                 Animar barras
                */


                barras.forEach(
                    function (
                        barra,
                        indice
                    ) {


                        barra.style.animationDelay =
                            indice *
                            0.08 +
                            "s";


                        barra.classList.add(
                            "animar"
                        );

                    }
                );



                /*
                 Desvanecer sonido
                */


                volumen.gain.exponentialRampToValueAtTime(

                    0.001,

                    audioContext.currentTime +
                    2

                );



                /*
                 Detener sonido
                */


                oscilador.stop(

                    audioContext.currentTime +
                    2

                );



                /*
                 Detener animación
                */


                setTimeout(
                    function () {


                        barras.forEach(
                            function (
                                barra
                            ) {


                                barra.classList.remove(
                                    "animar"
                                );

                            }
                        );


                    },

                    2000

                );


            }
        );


    </script>


</body>

</html>
